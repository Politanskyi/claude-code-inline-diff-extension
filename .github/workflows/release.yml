name: Release
# Push a tag like v0.1.32 (matching package.json): the .vsix is built, tested and attached to a GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" claude-inline-diff.vsix \
            --title "Claude Inline Diff $GITHUB_REF_NAME" \
            --notes "Install: download claude-inline-diff.vsix below, then in Cursor: Extensions → … → Install from VSIX…, and click **Set Up** when the extension asks. Changes: see CHANGELOG.md."
